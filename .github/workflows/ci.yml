name: CI

# Politica Git Backlog v6: main protegida, develop integra. CI sobre PR y develop.
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web-ecommerce, web-erp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck -w @cuchostool/${{ matrix.app }}
      - run: npm run test -w @cuchostool/${{ matrix.app }} --if-present
      - run: npm run build -w @cuchostool/${{ matrix.app }}

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  contracts:
    name: Validar contratos de eventos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run validate:contracts

  docker-build:
    name: Docker images (artefacto inmutable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cuchostool-api:ci ./apps/api
      - run: docker build -f apps/web-ecommerce/Dockerfile -t cuchostool-web-ecommerce:ci .
      - run: docker build -f apps/web-erp/Dockerfile -t cuchostool-web-erp:ci .
